apiVersion: v1
kind: PersistentVolumeClaim # réclamation de volume persistant pour PostgreSQL
metadata:
  name: postgres-pvc
spec:
  accessModes:
    - ReadWriteOnce # lecture et écriture par un seul nœud
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Service # service pour exposer PostgreSQL
metadata: # métadonnées du service
  name: db
spec:
  ports:
    - port: 5432 # port PostgreSQL par défaut
  selector:
    app: db # sélectionne les pods avec le label app=db
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: db
spec:
  selector:
    matchLabels:
      app: db
  template:
    metadata:
      labels:
        app: db
    spec:
      containers:
        - image: postgres:15-alpine
          name: postgres
          env:
            - name: POSTGRES_USER
              value: "postgres"
            - name: POSTGRES_PASSWORD
              value: "postgres"
          ports:
            - containerPort: 5432
          volumeMounts:
            - mountPath: /var/lib/postgresql/data
              name: postgres-data
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: postgres-pvc # claimname sert à lier le PVC défini plus haut et le volume du conteneur
