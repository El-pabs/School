- hosts: web_servers
  become: yes
  gather_facts: no
  vars:
    server_name: "Serveur AWS"
    message: "Site déployé par Terraform & Ansible"

  tasks:
    # 1. On installe Python 3.8
    - name: Install Python 3.8
      raw: "amazon-linux-extras install python3.8 -y"
      changed_when: false

    # 2. On configure l'interpréteur
    - name: Set python interpreter
      set_fact:
        ansible_python_interpreter: /usr/bin/python3.8

    # 3. Installation Apache via Shell
    - name: Install Apache (httpd)
      shell: "yum install -y httpd"

    # 4. Démarrage
    - name: Start Apache
      service:
        name: httpd
        state: started
        enabled: yes

    # 5. Copie du site
    - name: Deploy Site
      template:
        src: index.html.j2
        dest: /var/www/html/index.html
        mode: '0644'
