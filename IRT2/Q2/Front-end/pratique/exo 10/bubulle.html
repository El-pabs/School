<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bubulle | Exercice jQuery</title>
    <style>
    body { font-family:Calibri, sans-serif; }
    #nav { position:relative; background-color:#444; }
    #menu { display:flex; flex-direction:row; position:relative; z-index:2; }
    #menu a { color:#fff; flex:1; padding:1rem; text-align:center; text-decoration:none; font-size:1.5rem; }
    #bubulle { 
        background-color:#c048; 
        border-radius:8px;
        position:absolute; 
        top:-8px; left:40vw; 
        width:20vw;
        height:4.8rem;
        z-index:1;
        transition: all 0.6s ease;
        opacity: 0;
    }
    
    @media screen and (max-width:560px) { 
        #menu { flex-direction:column; }
        #bubulle { transition: all 0.4s ease; }
    }
    </style>
</head>
<body>
    <nav id="nav">
        <div id="menu">
            <a href="#">Africa</a>
            <a href="#">America</a>
            <a href="#">Asia</a>
            <a href="#">Europa</a>
            <a href="#">Oceania</a>
        </div>
        <div id="bubulle"></div>
    </nav>
    <script src="jquery-3.7.1.min.js"></script>
    <script>
        $(document).ready(function() {
            $('#menu a').hover(
                function() {
                    let $this = $(this);
                    let position = $this.position();
                    let width = $this.outerWidth();
                    let height = $this.outerHeight();
                    
                    $('#bubulle').css({
                        left: position.left,
                        width: width,
                        top: position.top - 8,
                        height: height + 16,
                        opacity: 1
                    });
                },
                function() {
                    $('#bubulle').css('opacity', 1);
                }
            );
        });
    </script>
</body>
</html>
