<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EXO1</title>
   </head> 
<body>

    <img src="quentin.png" alt="sauce" id="image" width="200px" height="200px">

    <script>
        let count = 2;
        document.getElementById('image').addEventListener('click', change);
        function change() {
            if (count % 2 == 0) {
                this.src = "traumatized.webp";
            } else {
                this.src = "quentin.png";
            }
            count++;
        }
    </script>

</body>
</html>
