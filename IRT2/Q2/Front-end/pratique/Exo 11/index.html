<!DOCTYPE HTML>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galerie de Vignettes</title>
    <style>
        body {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
        }
        figure {
            margin: 0;
            padding: 0;
            width: 300px;
            text-align: center;
            transition: transform 0.3s;
        }
        figure:hover {
            transform: scale(1.05);
        }
        img {
            width: 100%;
            height: auto;
            cursor: pointer;
        }
        figcaption {
            padding: 10px;
            background-color: #f0f0f0;
        }
        .lightbox {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            justify-content: center;
            align-items: center;
        }
        .lightbox img {
            max-width: 90%;
            max-height: 90%;
        }
    </style>
</head>
<body>
    <figure>
        <img src="img/max1.jpg" alt="Description de l'image 1" onclick="openLightbox(this.src)">
        <figcaption>Description de l'image 1</figcaption>
    </figure>
    <figure>
        <img src="img/max2.jpg" alt="Description de l'image 2" onclick="openLightbox(this.src)">
        <figcaption>Description de l'image 2</figcaption>
    </figure>
    <figure>
        <img src="img/max3.jpg" alt="Description de l'image 3" onclick="openLightbox(this.src)">
        <figcaption>Description de l'image 3</figcaption>
        </figure>
        <figure>
        <img src="img/max4.jpg" alt="Description de l'image 4" onclick="openLightbox(this.src)">
        <figcaption>Description de l'image 4</figcaption>
        </figure>
        <figure>
        <img src="img/max5.jpg" alt="Description de l'image 5" onclick="openLightbox(this.src)">
        <figcaption>Description de l'image 5</figcaption>
        </figure>
        <figure>
        <img src="img/max6.jpg" alt="Description de l'image 6" onclick="openLightbox(this.src)">
        <figcaption>Description de l'image 6</figcaption>
        </figure>
        <figure>
        <img src="img/max7.jpg" alt="Description de l'image 7" onclick="openLightbox(this.src)">
        <figcaption>Description de l'image 7</figcaption>
        </figure>
        <figure>
        <img src="img/max8.jpg" alt="Description de l'image 8" onclick="openLightbox(this.src)">
        <figcaption>Description de l'image 8</figcaption>
        </figure>
        <figure>
        <img src="img/max9.jpg" alt="Description de l'image 9" onclick="openLightbox(this.src)">
        <figcaption>Description de l'image 9</figcaption>
        </figure>
        <figure>
        <img src="img/max10.jpg" alt="Description de l'image 10" onclick="openLightbox(this.src)">
        <figcaption>Description de l'image 10</figcaption>
        </figure>
        <figure>
        <img src="img/max11.jpg" alt="Description de l'image 11" onclick="openLightbox(this.src)">
        <figcaption>Description de l'image 11</figcaption>
        </figure>
        <figure>
        <img src="img/max12.jpg" alt="Description de l'image 12" onclick="openLightbox(this.src)">
        <figcaption>Description de l'image 12</figcaption>
    </figure>

    <div class="lightbox" id="lightbox" onclick="closeLightbox()">
        <img id="lightbox-img" src="">
    </div>

    <script>
        function openLightbox(src) {
            document.getElementById('lightbox-img').src = src;
            document.getElementById('lightbox').style.display = 'flex';
        }

        function closeLightbox() {
            document.getElementById('lightbox').style.display = 'none';
        }
    </script>
</body>
</html></div>
