<!DOCTYPE HTML>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galerie de Vignettes</title>
    <style>
        body {
            background-color: red;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }
        figure {
            margin: 0;
            padding: 0;
            width: 300px;
            text-align: center;
            transition: transform 0.3s;
            cursor: pointer;
        }
        figure:hover {
            transform: scale(1.05);
        }
        img {
            width: 100%;
            height: auto;
        }
        figcaption {
            padding: 10px;
            background-color: #f0f0f0;
        }
        .lightbox {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            justify-content: center;
            align-items: center;
        }
        .lightbox img {
            max-width: 90%;
            max-height: 90%;
        }
        #hamburger {
            position: fixed;
            background-color: black;
            top: 10px;
            left: 10px;
            width: 40px;
            height: 40px;
            background-image: url('menu.svg');
            background-size: cover;
            cursor: pointer;
            z-index: 1001;
        }
        #hamburger.open {
            background-image: url('cross.svg');
            transition: 0.3s ease;
            left: 260px;
        }
        #nav {
            position: fixed;
            top: 0;
            left: -250px;
            width: 250px;
            height: 100%;
            background-color: #333;
            color: white;
            transition: left 0.3s ease;
            z-index: 1000;
        }
        #nav.open {
            left: 0;
        }
        #nav ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        #nav ul li {
            padding: 15px;
            border-bottom: 1px solid #444;
        }
        #nav ul li a {
            color: white;
            text-decoration: none;
        }
        @media (max-width: 600px) {
            #hamburger {
                display: block;
            }
        }
    </style>
</head>
<body>
    <div id="hamburger"></div>
    <nav id="nav">
        <ul>
            <li><a href="#">Accueil</a></li>
            <li><a href="#">Galerie</a></li>
            <li><a href="#">Contact</a></li>
        </ul>
    </nav>
    <figure>
        <img src="img/max1.jpg" alt="Description de l'image 1">
        <figcaption>Description de l'image 1</figcaption>
    </figure>
    <figure>
        <img src="img/max2.jpg" alt="Description de l'image 2">
        <figcaption>Description de l'image 2</figcaption>
    </figure>
    <figure>
        <img src="img/max3.jpg" alt="Description de l'image 3">
        <figcaption>Description de l'image 3</figcaption>
    </figure>
    <figure>
        <img src="img/max4.jpg" alt="Description de l'image 4">
        <figcaption>Description de l'image 4</figcaption>
    </figure>
    <figure>
        <img src="img/max5.jpg" alt="Description de l'image 5">
        <figcaption>Description de l'image 5</figcaption>
    </figure>
    <figure>
        <img src="img/max6.jpg" alt="Description de l'image 6">
        <figcaption>Description de l'image 6</figcaption>
    </figure>
    <figure>
        <img src="img/max7.jpg" alt="Description de l'image 7">
        <figcaption>Description de l'image 7</figcaption>
    </figure>
    <figure>
        <img src="img/max8.jpg" alt="Description de l'image 8">
        <figcaption>Description de l'image 8</figcaption>
    </figure>
    <figure>
        <img src="img/max9.jpg" alt="Description de l'image 9">
        <figcaption>Description de l'image 9</figcaption>
    </figure>
    <figure>
        <img src="img/max10.jpg" alt="Description de l'image 10">
        <figcaption>Description de l'image 10</figcaption>
    </figure>
    <figure>
        <img src="img/max11.jpg" alt="Description de l'image 11">
        <figcaption>Description de l'image 11</figcaption>
    </figure>
    <figure>
        <img src="img/max12.jpg" alt="Description de l'image 12">
        <figcaption>Description de l'image 12</figcaption>
    </figure>

    <div class="lightbox" id="lightbox">
        <img id="lightbox-img" src="">
    </div>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script>
        $(function() {
            // Lightbox ouverture
            $("figure").on("click", function() {
                let src = $(this).find("img").attr("src");
                $("#lightbox-img").attr("src", src);
                $("#lightbox").css("display", "flex");
            });

            // Lightbox fermeture
            $("#lightbox").on("click", function() {
                $(this).css("display", "none");
            });

            // Fermer lightbox avec Escape
            $(document).on("keydown", function(e) {
                if (e.key === "Escape") {
                    $("#lightbox").css("display", "none");
                }
            });

            // Hamburger menu toggle
            $("#hamburger").on("click", function(e) {
                $("#nav").toggleClass("open");
                $(this).toggleClass("open");
                e.stopPropagation();
            });

            // Fermer menu si clic en dehors
            $(document).on("click", function(e) {
                if (!$(e.target).closest("#nav, #hamburger").length) {
                    $("#nav").removeClass("open");
                    $("#hamburger").removeClass("open");
                }
            });
        });
    </script>
</body>
</html>
