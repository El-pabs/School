ips_sensor:
    - all_default:
        comment: "All predefined signatures with default setting."
        entries:
            - 1:



    - all_default_pass:
        comment: "All predefined signatures with PASS action."
        entries:
            - 1:
                action: pass



    - protect_http_server:
        comment: "Protect against HTTP server-side vulnerabilities."
        entries:
            - 1:
                location: server
                protocol: HTTP



    - protect_email_server:
        comment: "Protect against email server-side vulnerabilities."
        entries:
            - 1:
                location: server
                protocol: SMTP POP3 IMAP



    - protect_client:
        comment: "Protect against client-side vulnerabilities."
        entries:
            - 1:
                location: client



    - high_security:
        comment: "Blocks all Critical/High/Medium and some Low severity vulnerabilities"
        block-malicious-url: enable
        entries:
            - 1:
                severity: medium high critical
                status: enable
                action: block

            - 2:
                severity: low




firewall_shaper_traffic-shaper:
    - high-priority:
        maximum-bandwidth: 1048576
        per-policy: enable

    - medium-priority:
        maximum-bandwidth: 1048576
        priority: medium
        per-policy: enable

    - low-priority:
        maximum-bandwidth: 1048576
        priority: low
        per-policy: enable

    - guarantee-100kbps:
        guaranteed-bandwidth: 100
        maximum-bandwidth: 1048576
        per-policy: enable

    - shared-1M-pipe:
        maximum-bandwidth: 1024


