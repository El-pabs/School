#config-version=FGT60E-7.4.3-FW-build2573-240201:opmode=0:vdom=1:user=admin
#conf_file_ver=385752487779912
#buildno=2573
#global_vdom=0:vd_name=root/root
#password_mask=1
system_interface:
    - wan1:
        vdom: "root"
        ip: 172.27.0.2 255.255.255.252
        allowaccess: ping https ssh snmp http fgfm fabric
        type: physical
        role: wan
        snmp-index: 1

    - wan2:
        vdom: "root"
        ip: 192.168.2.11 255.255.255.0
        allowaccess: ping https ssh snmp http fgfm fabric
        type: physical
        role: wan
        snmp-index: 2

    - internal1:
        vdom: "root"
        type: physical
        snmp-index: 4

    - modem:
        vdom: "root"
        mode: pppoe
        status: down
        type: physical
        snmp-index: 11

    - naf.root:
        vdom: "root"
        type: tunnel
        src-check: disable
        snmp-index: 12

    - l2t.root:
        vdom: "root"
        type: tunnel
        snmp-index: 13

    - ssl.root:
        vdom: "root"
        type: tunnel
        alias: "SSL VPN interface"
        snmp-index: 14

    - npu0_vlink0:
        vdom: "root"
        allowaccess: ping
        type: physical
        snmp-index: 17

    - npu0_vlink1:
        vdom: "root"
        allowaccess: ping
        type: physical
        snmp-index: 18

    - LINK-AG091:
        vdom: "root"
        ip: 172.28.251.5 255.255.255.252
        allowaccess: ping ssh fabric
        type: vdom-link
        snmp-index: 52

    - internal:
        vdom: "root"
        ip: 192.168.1.99 255.255.255.0
        allowaccess: ping https ssh http
        type: hard-switch
        stp: enable
        device-identification: enable
        role: lan
        snmp-index: 15

    - fortilink:
        vdom: "root"
        fortilink: enable
        ip: 10.255.1.1 255.255.255.0
        allowaccess: ping fabric
        type: aggregate
        lldp-reception: enable
        lldp-transmission: enable
        snmp-index: 16

    - Link-AG081:
        vdom: "root"
        ip: 172.27.251.5 255.255.255.252
        allowaccess: ping ssh snmp fabric
        type: vdom-link
        snmp-index: 38

    - VPN-68:
        vdom: "root"
        type: tunnel
        snmp-index: 56
        interface: "wan2"

    - VPNSITE1:
        vdom: "root"
        type: tunnel
        snmp-index: 57
        interface: "wan2"


system_admin:
    - admin:
        trusthost1: 192.168.1.0 255.255.255.0
        trusthost2: 172.27.50.0 255.255.255.0
        trusthost3: 172.100.0.0 255.255.255.0
        trusthost4: 172.28.50.0 255.255.255.0
        trusthost5: 172.28.60.0 255.255.255.0
        trusthost6: 172.28.60.100 255.255.255.255
        accprofile: "super_admin"
        vdom: "root"
        gui-dashboard:
            - 1:
                name: "Status"
                vdom: "root"
                permanent: enable
                widget:
                    - 1:
                        width: 1
                        height: 1

                    - 2:
                        type: licinfo
                        x-pos: 1
                        width: 1
                        height: 1

                    - 3:
                        type: forticloud
                        x-pos: 2
                        width: 1
                        height: 1

                    - 4:
                        type: security-fabric
                        x-pos: 3
                        width: 1
                        height: 1

                    - 5:
                        type: admins
                        x-pos: 4
                        width: 1
                        height: 1

                    - 6:
                        type: cpu-usage
                        x-pos: 5
                        width: 2
                        height: 1

                    - 7:
                        type: memory-usage
                        x-pos: 6
                        width: 2
                        height: 1

                    - 8:
                        type: sessions
                        x-pos: 7
                        width: 2
                        height: 1



            - 2:
                name: "Security"
                vdom: "root"
                widget:
                    - 1:
                        type: fortiview
                        width: 2
                        height: 1
                        fortiview-type: "compromisedHosts"
                        fortiview-sort-by: "verdict"
                        fortiview-timeframe: "hour"
                        fortiview-visualization: "table"

                    - 2:
                        type: fortiview
                        x-pos: 1
                        width: 2
                        height: 1
                        fortiview-type: "threats"
                        fortiview-sort-by: "threatLevel"
                        fortiview-timeframe: "hour"
                        fortiview-visualization: "table"

                    - 3:
                        type: device-vulnerability
                        x-pos: 2
                        width: 2
                        height: 1



            - 3:
                name: "Network"
                vdom: "root"
                widget:
                    - 1:
                        type: routing
                        width: 2
                        height: 1
                        router-view-type: "staticdynamic"

                    - 2:
                        type: dhcp
                        x-pos: 1
                        width: 2
                        height: 1

                    - 3:
                        type: virtual-wan
                        x-pos: 2
                        width: 2
                        height: 1

                    - 4:
                        type: ipsec-vpn
                        x-pos: 3
                        width: 2
                        height: 1



            - 4:
                name: "Assets & Identities"
                vdom: "root"
